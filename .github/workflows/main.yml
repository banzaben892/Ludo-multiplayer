name: Build with Auto-Fix Suggestions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          
      - name: Grant permission
        run: chmod +x android/gradlew
        
      - name: Build APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          
      - name: Generate Fix Report
        if: steps.build.outputs.exit_code != '0'
        run: |
          cat > FIXES.md << 'EOF'
          # 🔧 Corrections nécessaires
          
          ## 1. GameState.kt - Ajouter ces propriétés
          \`\`\`kotlin
          data class GameState(
              val current: Player? = null,
              val message: String = "",
              val waitChoice: Boolean = false,
              val animating: Boolean = false,
              val playableIds: List<String> = emptyList(),
              val prizePool: Double = 0.0,
              val competitionId: String = "",
              val history: List<GameTurn> = emptyList(),
              val ranking: List<Player> = emptyList()
          )
          \`\`\`
          
          ## 2. Colors.kt - Créer ce fichier
          \`\`\`kotlin
          package com.ludomasterpro.ui.theme
          import androidx.compose.ui.graphics.Color
          val Green = Color(0xFF4CAF50)
          val TextDim = Color(0xFF888888)
          \`\`\`
          
          ## 3. Remplacer Surface(onClick=...) par Modifier.clickable
          \`\`\`kotlin
          Surface(modifier = Modifier.clickable { }) { }
          \`\`\`
          
          ## 4. Remplacer animateColor par animateColorAsState
          \`\`\`kotlin
          import androidx.compose.animation.animateColorAsState
          val color by animateColorAsState(targetValue = ...)
          \`\`\`
          EOF
          
          echo "✅ Rapport généré: FIXES.md"
          
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCoin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          
      - name: Upload Fixes
        if: steps.build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: fixes-needed
          path: FIXES.md
